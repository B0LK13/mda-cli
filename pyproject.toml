[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "mda-cli"
version = "0.3.5"
description = "CLI wrapper for Markdown Document Architect — restructure Markdown via Anthropic using local SKILL.md + MDA-STANDARD.md"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "anthropic>=0.40.0",
  "textual>=0.47.0",
]

[project.scripts]
mda = "mda_cli.cli:main"
mda-cli = "mda_cli.cli:main"
mda-tui = "mda_cli.cli:main"

[project.optional-dependencies]
pdf = ["pypdf>=4"]
docx = ["python-docx>=1.1"]
documents = ["pypdf>=4", "python-docx>=1.1"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: live Anthropic API (set ANTHROPIC_API_KEY; skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["mda_cli"]

[tool.hatch.build.targets.wheel.force-include]
"mda_cli/bundled_skills" = "mda_cli/bundled_skills"

[tool.hatch.build.targets.sdist]
include = [
  "mda_cli/bundled_skills/**",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
